services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
      - "7001:7001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.pdc/floci-data:/data
    environment:
      - FLOCI_HOSTNAME=floci
      - FLOCI_DEFAULT_REGION=us-east-1
      - FLOCI_STORAGE_MODE=hybrid
      - FLOCI_STORAGE_PERSISTENT_PATH=/data

  glue-jobs:
    build: ./plataforma/emuladores/glue_jobs
    container_name: glue-jobs
    ports:
      - "4567:4567"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pdc-glue-trabajo:/trabajo
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - FLOCI_URL=http://floci:4566
    depends_on:
      - floci

  airflow-ui:
    image: alpine/socat
    container_name: airflow-ui
    command: TCP-LISTEN:8080,fork,reuseaddr TCP:floci-mwaa-000000000000.us-east-1.pdc-airflow-airflow:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./plataforma/grafana/provisioning:/etc/grafana/provisioning
      - ./plataforma/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - POSTGRES_LECTOR_PASSWORD=${POSTGRES_LECTOR_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/monitoreo.json
    depends_on:
      - floci

volumes:
  pdc-glue-trabajo:
    name: pdc-glue-trabajo
